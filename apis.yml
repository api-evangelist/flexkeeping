aid: flexkeeping
name: Flexkeeping
description: >-
  Flexkeeping is a hotel operations automation platform (owned by Mews) that
  streamlines housekeeping, maintenance, front-office collaboration, and quality
  assurance for hotels and resorts. It centralizes staff task management,
  automated room cleaning schedules, checklists, lost-and-found, and guest
  service requests, and connects to major property management systems so
  operational teams can reduce manual work, coordinate across departments, and
  improve the guest experience across thousands of properties worldwide.
  Flexkeeping is an integration consumer rather than an API producer: it does
  not publish a public developer portal, OpenAPI definition, or API keys.
  Instead it ships pre-built connectors into PMS platforms including Mews,
  Apaleo, Oracle OPERA Cloud, Cloudbeds, RMS Cloud, Guesty, Shiji, Protel,
  SiHot, and Beds24.
